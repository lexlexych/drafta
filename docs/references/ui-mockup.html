<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drafta — макет интерфейса</title>
<style>
:root{
  --bg:#F5F6F3; --surface:#FFFFFF; --surface2:#EFF1EC; --hover:#F2F4F0;
  --ink:#20242A; --ink2:#5A6270; --ink3:#8D95A3; --line:#E3E6E0; --line2:#D8DCD4;
  --accent:#0E7A6B; --accent-hov:#0C6B5E; --accent-ink:#FFFFFF; --accent-soft:#E2F0ED; --accent-soft-ink:#0B5D52;
  --draft-bg:#FBF6E8; --draft-line:#EADFB9; --draft-ink:#8A6D1F; --draft-chip:#F3E9C9;
  --out-bg:#0E7A6B; --out-ink:#F2FAF8;
  --ig:#D6356F; --fb:#1877F2;
  --c-price:#0E7A6B; --c-order:#3563B8; --c-complaint:#C2543A; --c-spam:#8D95A3; --c-default:#6B7280;
  --badge:#D8452F; --ok:#2E8B57;
  --shadow:0 1px 2px rgba(24,28,23,.05),0 4px 16px rgba(24,28,23,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171A; --surface:#1C2025; --surface2:#23282E; --hover:#22272D;
    --ink:#E8EBEE; --ink2:#A6AEB8; --ink3:#6F7883; --line:#2B3138; --line2:#343B43;
    --accent:#3FB3A2; --accent-hov:#4FC4B2; --accent-ink:#0D211D; --accent-soft:#14332D; --accent-soft-ink:#7BCFC1;
    --draft-bg:#252017; --draft-line:#4A3F22; --draft-ink:#D9BA60; --draft-chip:#37301C;
    --out-bg:#0F5C50; --out-ink:#DCF2EE;
    --c-price:#3FB3A2; --c-order:#7DA3E8; --c-complaint:#E08A72; --c-spam:#6F7883; --c-default:#9AA2AC;
    --badge:#E06549; --ok:#57B57F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="light"]{
  --bg:#F5F6F3; --surface:#FFFFFF; --surface2:#EFF1EC; --hover:#F2F4F0;
  --ink:#20242A; --ink2:#5A6270; --ink3:#8D95A3; --line:#E3E6E0; --line2:#D8DCD4;
  --accent:#0E7A6B; --accent-hov:#0C6B5E; --accent-ink:#FFFFFF; --accent-soft:#E2F0ED; --accent-soft-ink:#0B5D52;
  --draft-bg:#FBF6E8; --draft-line:#EADFB9; --draft-ink:#8A6D1F; --draft-chip:#F3E9C9;
  --out-bg:#0E7A6B; --out-ink:#F2FAF8;
  --ig:#D6356F; --fb:#1877F2;
  --c-price:#0E7A6B; --c-order:#3563B8; --c-complaint:#C2543A; --c-spam:#8D95A3; --c-default:#6B7280;
  --badge:#D8452F; --ok:#2E8B57;
  --shadow:0 1px 2px rgba(24,28,23,.05),0 4px 16px rgba(24,28,23,.06);
}
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1C2025; --surface2:#23282E; --hover:#22272D;
  --ink:#E8EBEE; --ink2:#A6AEB8; --ink3:#6F7883; --line:#2B3138; --line2:#343B43;
  --accent:#3FB3A2; --accent-hov:#4FC4B2; --accent-ink:#0D211D; --accent-soft:#14332D; --accent-soft-ink:#7BCFC1;
  --draft-bg:#252017; --draft-line:#4A3F22; --draft-ink:#D9BA60; --draft-chip:#37301C;
  --out-bg:#0F5C50; --out-ink:#DCF2EE;
  --c-price:#3FB3A2; --c-order:#7DA3E8; --c-complaint:#E08A72; --c-spam:#6F7883; --c-default:#9AA2AC;
  --badge:#E06549; --ok:#57B57F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:236px;flex:none;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--line)}
.main{flex:1;display:flex;min-width:0;min-height:0}
.tabbar{display:none}

/* ---------- sidebar ---------- */
.logo{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
.logo b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.logo b i{font-style:normal;color:var(--accent)}
.logo .ws{font-size:11px;color:var(--ink3);margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:4px 8px 8px;display:flex;flex-direction:column;gap:1px}
.nitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:500}
.nitem:hover{background:var(--hover)}
.nitem.on{background:var(--accent-soft);color:var(--accent-soft-ink)}
.nitem .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nitem .cnt{font-size:11px;font-weight:700;background:var(--badge);color:#fff;border-radius:99px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.nitem .chev{color:var(--ink3);transition:transform .15s}
.nitem .chev.open{transform:rotate(180deg)}
.sub{display:flex;flex-direction:column;gap:1px;margin:1px 0 3px}
.sitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px 6px 38px;border-radius:8px;color:var(--ink2);font-size:13px}
.sitem:hover{background:var(--hover)}
.sitem.on{background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:600}
.sitem .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .cnt{font-size:11px;font-weight:700;color:var(--ink3)}
.pdot{width:8px;height:8px;border-radius:99px;flex:none}
.pdot.instagram{background:var(--ig)} .pdot.facebook{background:var(--fb)} .pdot.all{background:var(--ink3)}
.sfoot{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.user{display:flex;align-items:center;gap:10px}
.user .who{min-width:0}
.user .who b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user .who span{font-size:11px;color:var(--ink3)}
.mocknote{font-size:10.5px;color:var(--ink3);letter-spacing:.04em;text-transform:uppercase}

/* ---------- avatars & chips ---------- */
.ava{border-radius:99px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.ava.md{width:40px;height:40px;font-size:14px}
.ava.sm{width:30px;height:30px;font-size:11px}
.ava.lg{width:56px;height:56px;font-size:19px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:1.5px 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip .pdot{width:6px;height:6px}
.chip.cat{background:transparent}
.cdot{width:6px;height:6px;border-radius:99px;flex:none}
.chip.st{color:var(--ok);border-color:transparent;background:transparent;padding-left:0}
.unread{font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex:none}

/* ---------- panes ---------- */
.pane-list{width:340px;flex:none;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--line)}
.pane-detail{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.phead{padding:14px 16px 10px;border-bottom:1px solid var(--line);flex:none}
.phrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.catsel{font:inherit;font-size:12px;font-weight:600;color:var(--ink2);background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:4px 8px;max-width:180px;flex:none}
.empty{padding:34px 16px;color:var(--ink3);font-size:13px;text-align:center}
.phead h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.phead .sub{font-size:12px;color:var(--ink3);margin-top:2px;display:block}
.filters{display:none;gap:6px;padding:8px 16px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line2);border-radius:99px;padding:4px 11px;white-space:nowrap}
.fchip.on{background:var(--accent-soft);color:var(--accent-soft-ink);border-color:transparent}
.list{flex:1;overflow-y:auto;min-height:0}
.litem{display:flex;gap:11px;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.litem:hover{background:var(--hover)}
.litem.on{background:var(--accent-soft)}
.litem .body{flex:1;min-width:0}
.lrow1{display:flex;align-items:baseline;gap:8px}
.lrow1 b{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow1 time{font-size:11px;color:var(--ink3)}
.lprev{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:1px 0 5px}
.litem.unrd .lprev{color:var(--ink);font-weight:600}
.lchips{display:flex;align-items:center;gap:5px;min-width:0}
.lchips .sp{flex:1}
.backbtn{display:none;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;color:var(--ink2);margin-left:-6px}
.backbtn:hover{background:var(--hover)}

/* ---------- thread ---------- */
.thead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;min-width:0}
.thead .who{min-width:0;flex:1}
.thead .who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thead .chips{display:flex;gap:5px;margin-top:3px;flex-wrap:wrap}
.tmsgs{flex:1;overflow-y:auto;min-height:0;padding:18px 18px 10px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:min(72%,520px);padding:8px 12px;border-radius:14px;font-size:13.5px;position:relative}
.bub.in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.out{align-self:flex-end;background:var(--out-bg);color:var(--out-ink);border-bottom-right-radius:4px}
.bub .bmeta{display:block;font-size:10.5px;margin-top:3px;opacity:.65;text-align:right}
.bub.in .bmeta{color:var(--ink3);opacity:1}
.att{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;margin-bottom:5px;color:var(--ink2)}
.bub.out .att{background:rgba(255,255,255,.14);border-color:transparent;color:var(--out-ink)}
.sysline{align-self:center;display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3);padding:2px 0;text-align:center}
.sysline svg{color:var(--draft-ink)}
.daysep{align-self:center;font-size:11px;font-weight:600;color:var(--ink3);padding:4px 0}

/* ---------- draft panel ---------- */
.dwrap{flex:none;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px}
.draft{background:var(--draft-bg);border:1px solid var(--draft-line);border-radius:14px;padding:11px 14px 12px;box-shadow:var(--shadow)}
.dtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dtop .ai{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--draft-ink);letter-spacing:.05em;text-transform:uppercase}
.dstat{font-size:11px;font-weight:700;border-radius:99px;padding:1.5px 8px;background:var(--draft-chip);color:var(--draft-ink)}
.dstat.edited{background:var(--accent-soft);color:var(--accent-soft-ink)}
.dcap{font-size:11px;color:var(--ink3);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dref{font-size:11.5px;color:var(--ink2);background:var(--draft-chip);border-radius:8px;padding:4px 9px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dtext{font-size:13.5px;margin:8px 0 2px;white-space:pre-wrap}
.dkb{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink3);margin-top:7px;flex-wrap:wrap}
.dkb .kbf{background:var(--draft-chip);color:var(--draft-ink);border-radius:6px;padding:0 6px;font-weight:600}
.dacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:9px;padding:6.5px 14px;border:1px solid transparent}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-hov)}
.btn.sec{border-color:var(--line2);color:var(--ink2);background:var(--surface)}
.btn.sec:hover{background:var(--hover)}
.btn.ghost{color:var(--ink3);padding:6.5px 8px}
.btn.ghost:hover{color:var(--ink2)}
.btn.sm{font-size:12px;padding:4.5px 11px}
.dta{width:100%;min-height:74px;resize:vertical;font:inherit;font-size:13.5px;color:var(--ink);background:var(--surface);border:1px solid var(--draft-line);border-radius:9px;padding:8px 10px;margin-top:8px}
.dta:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.skel{height:11px;border-radius:6px;background:linear-gradient(90deg,var(--draft-chip) 25%,var(--draft-line) 50%,var(--draft-chip) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;margin-top:9px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}.nitem .chev{transition:none}}
.ddone{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink3);background:var(--surface);border:1px dashed var(--line2);border-radius:12px;padding:9px 14px}
.composer{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:6px 6px 6px 14px}
.composer input{flex:1;border:0;background:none;font:inherit;font-size:13.5px;color:var(--ink);min-width:0}
.composer input:focus{outline:none}
.composer input::placeholder{color:var(--ink3)}
.sendbtn{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center}
.sendbtn:hover{background:var(--accent-hov)}

/* ---------- comments ---------- */
.postcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 16px 4px;flex:none}
.postcard .pr1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.postcard .ptext{font-size:13.5px;margin-top:7px}
.postcard .pmeta{font-size:11.5px;color:var(--ink3);margin-top:6px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.plink{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:11.5px}
.cmt{display:flex;gap:10px;align-items:flex-start;padding:2px 0}
.cmt.reply{margin-left:40px}
.cmt .cbody{min-width:0;flex:1}
.cmt .ch{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.cmt .ch b{font-size:13px}
.cmt .ch .hnd{font-size:11.5px;color:var(--ink3)}
.cmt .ctext{font-size:13.5px;margin-top:1px}
.cmt .cchips{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap;align-items:center}
.cmt.target .cbody{border-left:3px solid var(--draft-ink);padding-left:9px;margin-left:-12px}
.cmt.spam .ctext,.cmt.spam .ch b{color:var(--ink3)}
.cmt.ours .cbody{background:var(--accent-soft);border-radius:10px;padding:7px 10px}
.cmt.ours .ch b{color:var(--accent-soft-ink)}
.nospam{font-size:10.5px;color:var(--ink3);font-style:italic}

/* ---------- dashboard ---------- */
.single{flex:1;overflow-y:auto;min-height:0;padding:20px 22px 28px}
.single .inner{max-width:880px;margin:0 auto}
.h1row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.h1row h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.h1row .date{font-size:12.5px;color:var(--ink3)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:12px;color:var(--ink2);margin-top:1px}
.stat.hot{background:var(--draft-bg);border-color:var(--draft-line)}
.stat.hot .v{color:var(--draft-ink)}
.twocol{display:grid;grid-template-columns:1fr 1.2fr;gap:12px;align-items:start}
@media (max-width:1100px){.twocol{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3)}
.chrow{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px}
.chrow .bar{flex:1;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:40px}
.chrow .bar i{display:block;height:100%;border-radius:99px}
.chrow .n{font-weight:700;width:26px;text-align:right}
.feed{display:flex;flex-direction:column}
.frow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 6px;border-radius:10px}
.frow:hover{background:var(--hover)}
.frow .fb1{flex:1;min-width:0}
.frow .ft{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .fm{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
.frow time{font-size:11px;color:var(--ink3);flex:none}
.footnote{font-size:11.5px;color:var(--ink3);margin-top:14px;font-style:italic}

/* ---------- contacts ---------- */
.ccard{flex:1;overflow-y:auto;min-height:0;padding:20px 22px}
.ccard .inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;gap:14px;align-items:center}
.chead .cn{flex:1;min-width:0}
.chead h2{margin:0;font-size:19px;font-weight:800}
.tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.idrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.idrow:first-of-type{border-top:0}
.idrow .plat{display:inline-flex;align-items:center;gap:7px;font-weight:600;width:120px;flex:none}
.idrow .hnd{color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idrow .via{font-size:11.5px;color:var(--ink3)}
.hrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 6px;border-radius:10px;font-size:13px}
.hrow:hover{background:var(--hover)}
.hrow .hl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow time{font-size:11px;color:var(--ink3)}
.notes{font-size:13px;color:var(--ink2);white-space:pre-wrap}

/* ---------- settings ---------- */
.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.setrow:hover{background:var(--hover)}
.setrow.on{background:var(--accent-soft)}
.setrow .si{width:34px;height:34px;border-radius:9px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);flex:none}
.setrow .sb{flex:1;min-width:0}
.setrow .sb b{display:block;font-size:13.5px}
.setrow .sb span{font-size:11.5px;color:var(--ink3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spane{flex:1;overflow-y:auto;min-height:0;padding:20px 22px}
.spane .inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.spane h2{margin:0;font-size:18px;font-weight:800}
.spane .desc{font-size:12.5px;color:var(--ink3);margin-top:-6px}
.connrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}

  var h='<section class="pane-list"><div class="phead"><h2>'+esc(title)+'</h2>'
    +'<span class="sub">'+(S.cFilter?'контакты канала':'все каналы')+' · '+list.length+' контактов</span></div>'
    +filterChips('contacts',contactsCount,S.cFilter)
    +'<div class="list">';
  list.forEach(function(c){
    var plats=c.ids.map(function(i){ return '<span class="pdot '+i.p+'"></span>'; }).join(' ');
    h+='<button class="litem'+(c.id===S.contact?' on':'')+'" onclick="App.openContact(\''+c.id+'\')">'
      +ava(c.name,c.hue,'md')
      +'<div class="body"><div class="lrow1"><b>'+esc(c.name)+'</b></div>'
      +'<div class="lprev">'+c.ids.map(function(i){return esc(i.h);}).join(' · ')+'</div>'
      +'<div class="lchips">'+plats+(c.tags[0]?'<span class="chip">'+esc(c.tags[0])+'</span>':'')+'</div></div></button>';
  });
  h+='</div></section>';
  h+='<section class="pane-detail">'+contactCard(contact(S.contact))+'</section>';
  return h;
}
function contactCard(c){

    +'<div class="tags">'+c.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>';}).join('')+'</div></div>'
    +'<button class="btn sm sec" onclick="App.stub()">Склеить с другим…</button></div>';

      +'</div>';
    h+='<div class="card"><h3>Авто-генерация черновиков</h3>'
      +'<div class="tgrow"><div class="tl">Для сообщений<span>черновик на каждую пачку после дебаунса</span></div><button class="sw on" role="switch" aria-checked="true" aria-label="Авто-генерация для сообщений" onclick="App.stub()"></button></div>'

/* ============ рендер и действия ============ */
function render(){
  renderSidebar(); renderTabbar();
  var m=document.getElementById('main');
  if(S.screen==='dashboard') m.innerHTML=renderDashboard();
  else if(S.screen==='messages') m.innerHTML=renderMessages();
  else if(S.screen==='comments') m.innerHTML=renderComments();
  else if(S.screen==='contacts') m.innerHTML=renderContacts();
  else m.innerHTML=renderSettings();
  document.getElementById('app').classList.toggle('detail', S.detail && S.screen!=='dashboard');
}
function getDraft(kind,id){ return kind==='dm'? dm(id).draft : post(id).draft; }

var App={
  go:function(scr,filter){
    if(scr==='messages'||scr==='comments'){ S.filter=(filter===undefined? (S.screen===scr? S.filter : null) : filter); }
    if(scr==='contacts'){ S.cFilter=(filter===undefined? (S.screen===scr? S.cFilter : null) : filter); }
    if(scr!==S.screen){ S.detail=false; S.catFilter=null; }
    S.screen=scr;
    if(scr==='messages') S.exp.messages=true;
    if(scr==='comments') S.exp.comments=true;
    if(scr==='contacts') S.exp.contacts=true;
    if(scr==='settings') S.exp.settings=true;
    render();
  },
  setCat:function(v){ S.catFilter=v||null; render(); },
  toggle:function(k){ S.exp[k]=!S.exp[k]; renderSidebar(); },
  goSet:function(s){ S.screen='settings'; S.set=s; S.detail=true; S.exp.settings=true; render(); },
  openDm:function(id){ S.screen='messages'; S.dm=id; S.detail=true; var d=dm(id);
    if(d.ch!==S.filter) S.filter=null; d.unread=0; render(); },
  openPost:function(id){ S.screen='comments'; S.post=id; S.detail=true; var p=post(id);
    if(p.ch!==S.filter) S.filter=null; p.neu=0; p.cmts.forEach(function(k){k.neu=false;}); render(); },
  openContact:function(id){ S.screen='contacts'; S.contact=id; S.detail=true; render(); },
  openContactFromDm:function(id){ S.screen='contacts'; S.contact=id; S.detail=true; render(); },
  back:function(){ S.detail=false; render(); },
  accept:function(kind,id){
    var d=getDraft(kind,id);
    if(kind==='dm'){ dm(id).msgs.push({dir:'out', text:d.text, time:'сейчас', meta:'Отправлено · '+CH[dm(id).ch].label}); }
    else{ var p=post(id); var tgt=null; p.cmts.forEach(function(k){ if(k.target) tgt=k; });
      p.cmts.push({id:'r'+Date.now(), ours:true, an:'Tonwerk Keramik', text:d.text, time:'сейчас', parent:tgt?tgt.id:null});
      if(tgt) tgt.target=false; }
    d.status='sent'; render(); toast('Ответ отправлен через '+CH[(kind==='dm'?dm(id):post(id)).ch].label);
  },
  discard:function(kind,id){ getDraft(kind,id).status='discarded'; render(); },
  editDraft:function(kind,id){ var d=getDraft(kind,id); d.editing=true; render();
    var ta=document.getElementById('dta'); if(ta){ ta.focus(); ta.selectionStart=ta.value.length; } },
  saveEdit:function(kind,id){ var d=getDraft(kind,id); var ta=document.getElementById('dta');
    if(ta&&ta.value.trim()){ d.text=ta.value.trim(); d.status='edited'; } d.editing=false; render(); },
  cancelEdit:function(kind,id){ getDraft(kind,id).editing=false; render(); },
  regen:function(kind,id){ var d=getDraft(kind,id); d.editing=false; d.status='generating'; render();
    setTimeout(function(){ var old=d.text; d.text=d.alt||old; if(old) d.alt=old; d.status='ready'; render(); },1400); },
  stub:function(){ toast('Это макет — действие показано условно'); }
};

render();
</script>
